<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>The map in 3D</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; background: #14161a; overflow: hidden; }
      #look { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
      .view3d-canvas { display: block; width: 100%; height: 100%; outline: none; }
      .view3d-flash { display: none; }
      .look-note { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 8px 14px; border-radius: 10px; background: rgba(26, 29, 36, 0.94); color: #9aa3b2; font: 13px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="look"></div>
    <div class="look-note" id="note">Waiting for the map…</div>
    <script type="module" src="/src/client/look3d/main.ts"></script>
  </body>
</html>
